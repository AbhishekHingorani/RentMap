<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rental map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/app.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <main class="app">
      <section class="side" aria-label="Listings">
        <header class="side-head">
          <h1>Rental map</h1>
          <p class="who" id="who" hidden></p>
        </header>
        <div class="side-actions">
          <button class="add-open" id="add-open" type="button" hidden>+ Add listing</button>
        </div>
        <div class="tab-bar side-tabs" id="side-tabs" role="tablist" aria-label="Left column">
          <button class="tab" id="side-tab-listings" type="button" role="tab" data-tab="listings" aria-controls="list-view" aria-selected="true">Listings</button>
          <button class="tab" id="side-tab-places" type="button" role="tab" data-tab="places" aria-controls="places-view" aria-selected="false" tabindex="-1">Places</button>
        </div>
        <div class="list-view" id="list-view" role="tabpanel" aria-labelledby="side-tab-listings">
          <form class="filters" id="filters" aria-label="Filters" hidden>
            <label class="filter-search">
              <span>Search</span>
              <input id="filter-search" type="search" placeholder="Society or locality" autocomplete="off" />
            </label>
            <fieldset class="filter-configs">
              <legend>Configuration</legend>
              <div id="filter-configs"></div>
            </fieldset>
            <fieldset class="filter-by">
              <legend>Filter by</legend>
              <div class="filters-row">
                <label class="filter-sort">
                  <span>Price</span>
                  <select id="filter-price"></select>
                </label>
                <label class="filter-sort" id="filter-score-box">
                  <span>Distance score</span>
                  <select id="filter-score"></select>
                </label>
                <label class="filter-sort">
                  <span>Shortlist</span>
                  <select id="filter-shortlist"></select>
                </label>
              </div>
            </fieldset>
            <label class="filter-sort">
              <span>Sort by</span>
              <select id="sort-by"></select>
            </label>
          </form>
          <div class="list-bar">
            <p class="list-meta" id="list-meta" aria-live="polite">Loading the sheet…</p>
            <button class="select-open" id="select-open" type="button" hidden>Select</button>
          </div>
          <ol class="list" id="list"></ol>
          <div class="select-bar" id="select-bar" role="region" aria-label="Selected listings" hidden>
            <p class="select-count" id="select-count" aria-live="polite"></p>
            <div class="select-actions">
              <button class="select-all" id="select-all" type="button">Select all shown</button>
              <button class="select-cancel" id="select-cancel" type="button">Cancel</button>
              <button class="add-primary" id="select-mark" type="button">Mark as reviewed</button>
            </div>
          </div>
        </div>
        <div class="places-view" id="places-view" role="tabpanel" aria-labelledby="side-tab-places" hidden>
          <ol class="place-list" id="place-list"></ol>
          <form class="place-form" id="place-form" aria-labelledby="place-form-title">
            <h2 id="place-form-title">Add a place</h2>
            <label>
              <span>Name</span>
              <input name="name" required maxlength="60" placeholder="Office" autocomplete="off" />
            </label>
            <label>
              <span>Address</span>
              <input name="address" required maxlength="200" placeholder="Embassy Tech Village, Outer Ring Road" autocomplete="off" />
            </label>
            <label>
              <span>Coordinates <span class="place-optional">(optional)</span></span>
              <input name="coordinates" maxlength="60" placeholder="23.0300, 72.5100" autocomplete="off" inputmode="decimal" />
              <span class="place-hint">Right-click the spot in Google Maps to copy them. Leave empty to find the spot from the address.</span>
            </label>
            <button type="submit">Add the place</button>
            <p class="place-note" id="place-note" aria-live="polite"></p>
          </form>
        </div>
        <section class="add-view" id="add-view" aria-labelledby="add-title" hidden>
          <div class="add-head">
            <h2 id="add-title">Add a listing</h2>
            <button class="back-link" id="add-close" type="button">Cancel</button>
          </div>
          <ol class="add-steps" id="add-steps"></ol>
        </section>
      </section>
      <section class="detail-side" id="detail-side" aria-label="Listing details" hidden>
        <div class="detail-side-head">
          <button class="back-link" id="details-back" type="button">✕ Close</button>
        </div>
        <article class="details" id="details"></article>
      </section>
      <div class="map" id="map" aria-label="Map of listings"></div>
    </main>

    <dialog class="name-box" id="name-box" aria-labelledby="name-box-title">
      <form method="dialog" id="name-form">
        <h2 id="name-box-title">What is your name?</h2>
        <p>The app puts your name on the listings you add and the notes you write. It keeps your name on this computer.</p>
        <label for="name-input">Your name</label>
        <input id="name-input" name="name" autocomplete="given-name" required maxlength="40" />
        <button type="submit">Save my name</button>
      </form>
    </dialog>
  </body>
</html>
