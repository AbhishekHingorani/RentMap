const REAL_LINK = 'https://www.99acres.com/2-bhk-bedroom-apartment-flat-for-rent-in-ahad-excellencia-chikkanayakanahalli-bangalore-south-1160-sqft-spid-M93900012';
const AHAD_PHOTOS = [
  'https://imagecdn.99acres.com/media1/41417/2/828342725O-1787988609938.jpg',
  'https://imagecdn.99acres.com/media1/41417/2/828342709O-1787988602450.jpg',
  'https://imagecdn.99acres.com/media1/41417/2/828342885O-1787988611091.jpg',

  'https://imagecdn.99acres.com/media1/41417/2/828342809O-1787988606433.jpg',
];
// A good reply, shaped like the 07 resolution. "2 BHK" and "38,999" show the yellow auto-fix.
const SAMPLE_GOOD = '```json\n' + JSON.stringify({
  society:'Ahad Excellencia', locality:'Chikkanayakanahalli, Sarjapur Road', configuration:'2 BHK', listedBy:'Dealer',
  brokerName:null, rent:'38,999', maintenance:null, deposit:117000, brokerage:null, carpetArea:null, superArea:1160,

}, null, 1) + '\n```';
const SAMPLE_BAD = '```json\n{"error": "could_not_read"}\n```';

function blankListing(o){
  return Object.assign({id:'',society:null,locality:null,configuration:null,status:'To call',listedBy:null,brokerName:null,
    brokerPhone:'',ownerName:'',ownerPhone:'',rent:null,maintenance:null,deposit:null,brokerage:null,carpetArea:null,
    superArea:null,bathrooms:null,floor:null,furnishing:null,parking:null,lift:null,availableFrom:null,otherDetails:null,

}

const state = {
  user: null,
  budget: 45000, // Settings tab
  listings: [
    blankListing({id:'L-ahad1',society:'Ahad Excellencia',locality:'Chikkanayakanahalli, Sarjapur Road',configuration:'2BHK',

      parking:'Yes',availableFrom:'Immediately',otherDetails:'East facing; 2 balconies; full power backup',
      photos:AHAD_PHOTOS,link:REAL_LINK,lat:12.882808,long:77.690011,dateAdded:'2026-10-21'}),
    // Made-up listings from here on.
    blankListing({id:'L-sob22',society:'Sobha Dream Acres',locality:'Panathur',configuration:'2BHK',status:'Visited',listedBy:'Owner',
      rent:34000,maintenance:3500,deposit:150000,carpetArea:820,bathrooms:2,floor:'9 of 14',furnishing:'Unfurnished',parking:'Yes',lift:'Yes',
      ownerName:'Ramesh',ownerPhone:'98450 00000',ratings:{safety:4,water:3,location:4,condition:3,light:5},
      pros:['Big balcony','Club house'],cons:['Water tanker in summer'],
      notes:[{by:'Priya',date:'2026-10-20',text:'Owner wants 2 months of rent as deposit, not 4.'}],
      lat:12.9370,long:77.7140,precision:'society',addedBy:'Priya',dateAdded:'2026-10-19'}),
    blankListing({id:'L-pre31',society:'Prestige Lakeside Habitat',locality:'Varthur',configuration:'3BHK',listedBy:'Dealer',brokerName:'Suresh',
      rent:52000,maintenance:5000,deposit:300000,brokerage:52000,superArea:1650,bathrooms:3,floor:'6 of 18',furnishing:'Semi-furnished',
      parking:'Yes',lift:'Yes',lat:12.9480,long:77.7440,dateAdded:'2026-10-22'}),
    blankListing({id:'L-sal11',society:'Salarpuria Greenage',locality:'Bommanahalli',configuration:'1BHK',status:'Rejected',listedBy:'Owner',
      rent:22000,maintenance:2000,bathrooms:1,floor:'2 of 12',furnishing:'Fully furnished',ratings:{safety:3,water:2,location:2,condition:3,light:2},
      cons:['Faces the main road','Noisy'],lat:12.9020,long:77.6290,dateAdded:'2026-10-18'}),
    blankListing({id:'L-pur21',society:'Purva Skywood',locality:'Harlur',configuration:'2BHK',status:'Visit scheduled',listedBy:'Dealer',
      rent:41000,maintenance:4000,bathrooms:2,floor:'11 of 15',furnishing:'Semi-furnished',parking:'Yes',lift:'Yes',
      notes:[{by:'Abhishek',date:'2026-10-22',text:'Visit on Saturday 11 am. Broker sends the location pin.'}],
      lat:12.9050,long:77.6700,precision:'locality',dateAdded:'2026-10-22'}),
    blankListing({id:'L-kai01',society:'Independent house',locality:'Kaikondrahalli',configuration:'1RK',status:'Shortlisted',listedBy:'Owner',
      rent:null,bathrooms:1,floor:'1 of 2',furnishing:'Unfurnished',otherDetails:'Rent not on the listing. Ask the owner.',
      pros:['Quiet lane'],lat:12.9120,long:77.6810,precision:'locality',addedBy:'Priya',dateAdded:'2026-10-20'}),
  ],
  places: [ // made up
    {name:'Office',address:'Embassy Tech Village, Devarabeesanahalli',lat:12.9300,long:77.6880,precision:'building',addedBy:'Abhishek'},
    {name:'School',address:'Near Kasavanahalli lake',lat:12.8950,long:77.6950,precision:'locality',addedBy:'Priya'},
  ],
  f: null,
  mode: null,  // null | 'detail' | 'add' | 'places'
  sel: null, moving: null, dTab: 'overview', bTab: 'list', add: null,
};
function resetFilters(){ state.f = {max: state.budget, configs: new Set(CONFIGS), shortOnly:false, showRejected:false, q:''}; }
resetFilters();

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs = n => n == null || n === '' ? 'not given' : '₹' + Number(n).toLocaleString('en-IN');
const show = v => v == null || v === '' ? '<span class="muted">not given</span>' : esc(v);
const byId = id => state.listings.find(l => l.id === id);
const total = l => l.rent == null ? null : l.rent + (l.maintenance || 0);
function overall(l){ const v = Object.values(l.ratings).filter(x => x != null); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10 : null; }
const overallText = l => overall(l) == null ? 'not rated' : '★ ' + overall(l) + ' / 5';
const overBudget = l => total(l) != null && total(l) > state.budget;
const statusChip = l => `<span class="status" style="background:${STATUS_COLOR[l.status]}">${l.status}</span>`;
const short = n => n == null ? '₹?' : '₹' + Math.round(n/1000) + 'k';
const noteText = n => `${n.by}, ${n.date}: ${n.text}`;
function passes(l){
  const f = state.f;
  if (!f.showRejected && l.status === 'Rejected') return false;
  if (f.shortOnly && l.status !== 'Shortlisted') return false;
  if (l.configuration && !f.configs.has(l.configuration)) return false;
  const t = total(l);
  if (t != null && f.max !== '' && f.max != null && t > Number(f.max)) return false;
  if (f.q && !((l.society||'') + ' ' + (l.locality||'')).toLowerCase().includes(f.q.toLowerCase())) return false;
  return true;
}
const shown = () => state.listings.filter(passes);
const countText = () => `${shown().length} of ${state.listings.length} listings shown`;
function km(a, b){
  const R = 6371, r = x => x*Math.PI/180, dLat = r(b.lat-a.lat), dLon = r(b.long-a.long);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h))*10)/10;
}
const nearText = l => state.places.map(p => `${esc(p.name)} ${km(l,p)} km`).join(' · ');
function fakeGeocode(text){ // stub for Nominatim
  let h = 0; for (const c of text) h = (h*31 + c.charCodeAt(0)) | 0;
  return {lat: 12.91 + ((h % 300) / 10000), lng: 77.69 + (((h >> 8) % 300) / 10000)};
}
const prompt1 = link => `Open this rental listing: ${link || '<link>'}
Reply with one JSON object in a \`\`\`json block and nothing else.
Keys: society, locality, configuration (1RK|1BHK|2BHK|3BHK|4BHK+),
listedBy (Owner|Dealer), brokerName, rent, maintenance, deposit,
brokerage (numbers in rupees), carpetArea, superArea (sq ft),
bathrooms, floor (like "4 of 4"),
furnishing (Unfurnished|Semi-furnished|Fully furnished),
parking (Yes|No), lift (Yes|No), availableFrom, otherDetails,
photos (full-size image links of this flat only), lat, long.
Write null for anything the page does not show. Do not guess.
If you cannot open the page, reply {"error": "could_not_read"}.`;

function parseReply(text){
  const m = text.match(/```json\s*([\s\S]*?)```/) || text.match(/(\{[\s\S]*\})/);
  if (!m) return {fail:'No JSON found in the reply.'};
  let o; try { o = JSON.parse(m[1]); } catch (e) { return {fail:'The JSON in the reply is broken.'}; }
  if (o.error) return {fail:'Claude could not read the page.'};
  const data = {}, fixed = {};
  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9+]/g,'');
  for (const k of KEYS){
    let v = o[k.key] === undefined ? null : o[k.key];
    if (k.type === 'num' && typeof v === 'string'){ const n = Number(v.replace(/[^\d.]/g,'')); v = v.trim() && !isNaN(n) ? n : null; if (v != null) fixed[k.key] = true; }
    if (k.type === 'enum' && v != null && !k.opts.includes(v)){ const hit = k.opts.find(x => norm(x) === norm(v)); if (hit){ v = hit; fixed[k.key] = true; } else v = null; }
    data[k.key] = v;
  }
  data.photos = Array.isArray(o.photos) ? o.photos : (o.photos ? String(o.photos).split(';').map(s=>s.trim()) : []);
  if (data.rent == null && !data.locality) return {fail:'The reply has no rent and no locality.'};
  return {data, fixed};
}

// ---------- map ----------
let map, markerLayer, placeLayer, ringLayer;
function mountMap(){
  if (map) map.remove();
  map = L.map('map').setView([12.91, 77.69], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
  ringLayer = L.layerGroup().addTo(map); placeLayer = L.layerGroup().addTo(map); markerLayer = L.layerGroup().addTo(map);
  const pts = [...state.listings, ...state.places].map(p => [p.lat, p.long]);
  map.fitBounds(pts, {padding:[60,60]});
  drawMarkers();
}
function drawMarkers(){
  if (!map) return;
  markerLayer.clearLayers(); placeLayer.clearLayers(); ringLayer.clearLayers();
  for (const l of shown()){
    const sel = state.sel === l.id, moving = state.moving === l.id;
    const icon = L.divIcon({className:'', iconSize:[90,26], iconAnchor:[45,26],
      html:`<div class="pinwrap"><div class="pin ${sel?'sel':''} ${moving?'moving':''}" style="--c:${STATUS_COLOR[l.status]}">${short(total(l))} · ${l.configuration||'?'}</div></div>`});
    const m = L.marker([l.lat, l.long], {icon, draggable: moving, zIndexOffset: sel ? 1000 : 0}).addTo(markerLayer);
    m.on('click', () => ACT.select(l.id));
    m.on('dragend', () => { const p = m.getLatLng(); l.lat = +p.lat.toFixed(6); l.long = +p.lng.toFixed(6); l.precision = 'building'; render(); });
    if (sel && l.precision !== 'building')
      L.circle([l.lat, l.long], {radius: l.precision === 'society' ? 200 : 600, dashArray:'6 6', color:'#f59e0b', fillOpacity:.06}).addTo(ringLayer);
  }
  for (const p of state.places){
    L.marker([p.lat, p.long], {icon: L.divIcon({className:'', iconSize:[26,26], iconAnchor:[13,13], html:`<div class="ppin" title="${esc(p.name)}">★</div>`})})
      .bindTooltip(p.name, {permanent:true, direction:'right', offset:[12,0]}).addTo(placeLayer);
  }
}

// ---------- wiring ----------
const VARIANTS = {A: VA, B: VB, C: VC}, ORDER = ['A','B','C'];
let cur = (k => VARIANTS[k] ? k : 'A')(new URLSearchParams(location.search).get('variant')), V = VARIANTS[cur];
function render(){
  const keep = {}; document.querySelectorAll('[data-scroll]').forEach(e => keep[e.dataset.scroll] = e.scrollTop);
  V.render();
  document.querySelectorAll('[data-scroll]').forEach(e => { if (keep[e.dataset.scroll]) e.scrollTop = keep[e.dataset.scroll]; });
  const m = document.getElementById('modal');
  if (!state.user) m.innerHTML = `<div class="modal-back"><div class="modal" style="width:420px"><h3>Welcome</h3>
    <p>What is your name? The app puts it on listings you add and notes you write. It asks only once on this computer.</p>
    <div class="row"><input id="nameInput" placeholder="Your name" style="flex:1"><button class="primary" data-act="setName">Start</button></div></div></div>`;
  else { const html = V.modal ? V.modal() : ''; m.innerHTML = html ? `<div class="modal-back"><div class="modal" data-scroll="modal">${html}</div></div>` : ''; }
}
function mount(){
  V = VARIANTS[cur];
  document.getElementById('app').innerHTML = V.shell();
  mountMap(); render();
  document.getElementById('switcher').innerHTML = `<button data-sw="-1">‹</button><span>PROTOTYPE · ${cur} (${V.name})</span><button data-sw="1">›</button>`;
  if (!state.user) setTimeout(() => document.getElementById('nameInput')?.focus(), 0);
}
function cycle(d){ cur = ORDER[(ORDER.indexOf(cur) + d + ORDER.length) % ORDER.length]; try { history.replaceState(null, '', '?variant=' + cur); } catch (e) {} mount(); }
const curListing = () => byId(state.sel);

const ACT = {
  select: id => { const l = byId(id); state.sel = id; state.mode = 'detail'; state.dTab = 'overview'; state.moving = null; render(); drawMarkers(); const pt = map.latLngToContainerPoint([l.lat, l.long]).add(V.panShift ? V.panShift() : [0,0]); map.panTo(map.containerPointToLatLng(pt)); },
  close: () => { state.mode = null; state.sel = null; state.moving = null; state.add = null; render(); drawMarkers(); },
  add: () => { state.mode = 'add'; state.sel = null; state.moving = null; state.add = {by:'link', step:'link', link:'', reply:'', fail:null, data:null, fixed:{}, photos:[], usedBm:false}; render(); drawMarkers(); },
  addHand: () => { state.mode = 'add'; state.sel = null; state.add = {by:'hand', step:'review', link:'', reply:'', data:Object.fromEntries(KEYS.map(k=>[k.key,null])), fixed:{}, photos:[]}; render(); drawMarkers(); },
  sampleLink: () => { state.add.link = REAL_LINK; render(); },
  toReply: () => { if (!state.add.link.trim()) return alert('Paste a listing link first.'); state.add.step = 'reply'; render(); },
  copy: (_, btn) => { const done = t => btn.textContent = t; navigator.clipboard?.writeText(prompt1(state.add.link)).then(() => done('Copied'), () => done('Copy failed. Select the text.')); },
  sample: k => { state.add.reply = k === 'good' ? SAMPLE_GOOD : SAMPLE_BAD; render(); },
  check: () => { const a = state.add, r = parseReply(a.reply);
    if (r.fail){ a.fail = r.fail; if (a.step === 'reply'){ a.step = 'bookmarklet'; a.usedBm = true; a.reply = ''; } render(); return; }
    a.data = r.data; a.fixed = r.fixed; a.photos = r.data.photos; a.fail = null; a.step = 'review'; render(); },
  askLocal: (_, btn) => { btn.disabled = true; btn.textContent = 'Local Claude is reading...'; setTimeout(() => { state.add.reply = SAMPLE_GOOD; ACT.check(); }, 1200); },
  toBookmarklet: () => { const a = state.add; a.step = 'bookmarklet'; a.usedBm = true; a.fail = null; a.reply = ''; render(); },
  back: s => { state.add.step = s; render(); },
  rmphoto: i => { state.add.photos.splice(+i, 1); render(); },
  saveNew: () => { const a = state.add, d = a.data; let lat = d.lat, lng = d.long, precision = 'building';
    if (lat == null || lng == null){ const g = fakeGeocode((d.society||'') + ' ' + (d.locality||'')); lat = g.lat; lng = g.lng; precision = 'locality'; }
    const l = blankListing({...d, id:'L-' + Math.random().toString(36).slice(2,7), lat, long:lng, precision, photos:a.photos, link:a.link, addedBy:state.user});
    state.listings.push(l); state.add = null; ACT.select(l.id); },
  rate: arg => { const l = curListing(), [k, n] = arg.split(':'); l.ratings[k] = l.ratings[k] === +n ? null : +n; render(); },
  rmchip: arg => { const l = curListing(), [k, i] = arg.split(':'); l[k].splice(+i, 1); render(); },
  addNote: () => { const t = document.getElementById('noteText').value.trim(); if (!t) return; curListing().notes.push({by:state.user, date:TODAY, text:t}); render(); },
  movePin: () => { state.moving = state.moving ? null : state.sel; render(); drawMarkers(); },
  openPlaces: () => { state.sel = null; state.moving = null; if (cur === 'B'){ state.mode = null; state.bTab = 'places'; } else state.mode = 'places'; render(); drawMarkers(); },
  btab: t => { state.bTab = t; render(); },
  tab: t => { state.dTab = t; render(); },
  savePlace: () => { const name = document.getElementById('placeName').value.trim(), address = document.getElementById('placeAddr').value.trim();
    if (!name || !address) return alert('Give the place a name and an address.');
    const g = fakeGeocode(address); state.places.push({name, address, lat:g.lat, long:g.lng, precision:'locality', addedBy:state.user}); render(); drawMarkers(); },
  setName: () => { const v = document.getElementById('nameInput').value.trim(); if (!v) return; state.user = v; mount(); },
};

document.addEventListener('click', e => {
  const sw = e.target.closest('[data-sw]'); if (sw) return cycle(+sw.dataset.sw);
  const t = e.target.closest('[data-act]'); if (!t || t.tagName === 'A') return;
  ACT[t.dataset.act]?.(t.dataset.arg, t, e);
});
document.addEventListener('input', e => {
  const t = e.target, f = state.f;
  if (t.dataset.filter){
    if (t.dataset.filter === 'max') f.max = t.value;
    if (t.dataset.filter === 'config') t.checked ? f.configs.add(t.dataset.arg) : f.configs.delete(t.dataset.arg);
    if (t.dataset.filter === 'short') f.shortOnly = t.checked;
    if (t.dataset.filter === 'rej') f.showRejected = t.checked;
    if (t.dataset.filter === 'q') f.q = t.value;
    drawMarkers(); updateCount(); V.renderList?.();
  }
  if (t.hasAttribute('data-addlink')) state.add.link = t.value;
  if (t.hasAttribute('data-addreply')) state.add.reply = t.value;
  if (t.dataset.addfield){ const k = KEYS.find(x => x.key === t.dataset.addfield);
    state.add.data[k.key] = t.value === '' ? null : k.type === 'num' ? Number(t.value) : t.value; t.classList.remove('fixed'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.edit){ curListing()[t.dataset.edit] = t.value; if (t.dataset.edit === 'status'){ render(); drawMarkers(); updateCount(); V.renderList?.(); } }
  if (t.dataset.upload && t.files[0]){ const url = URL.createObjectURL(t.files[0]);
    (t.dataset.upload === 'new' ? state.add.photos : byId(t.dataset.upload).photos).push(url); render(); V.renderList?.(); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.id === 'nameInput') return ACT.setName();
  if (e.key === 'Enter' && t.dataset.chip){ const v = t.value.trim(); if (!v) return; const k = t.dataset.chip; curListing()[k].push(v); render(); document.querySelector(`[data-chip="${k}"]`)?.focus(); return; }
  if (t.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  if (e.key === 'ArrowRight') cycle(1);
});
// Screenshot hook: ?name=Abhishek&open=L-ahad1 or &add=review
const qs = new URLSearchParams(location.search);
if (qs.get('name')) state.user = qs.get('name');
mount();
if (qs.get('open')) ACT.select(qs.get('open'));
if (qs.get('add')){ ACT.add(); state.add.link = REAL_LINK; if (qs.get('add') === 'review'){ state.add.reply = SAMPLE_GOOD; ACT.check(); } else { state.add.step = qs.get('add'); state.add.usedBm = qs.get('add') === 'bookmarklet'; render(); } }
</script>
</body>
</html>
